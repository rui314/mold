[package]
name = "mold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A high-performance ELF linker, rewritten in Rust"
license.workspace = true
# tests/lib.rs belongs to the mold-tests workspace crate.
autotests = false

# The linker is generic over the target. Instantiating it for all twenty
# targets in one crate keeps the compiler on a single core for minutes, so
# each target is instantiated in a crate of its own under arch/, and the
# executable in cli/ dispatches to them.
[workspace]
exclude = ["vendor/rayon-core"]
members = ["cli", "arch/*", "tests"]
default-members = [".", "cli", "arch/*", "tests"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
mold = { path = "." }

[dependencies]
blake3 = "1.8.7"
bstr = "1"
cpp_demangle = "0.5.1"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc.workspace = true
libz-rs-sys = "0.6.8"
memchr = "2.8.3"
memmap2 = "0.9"
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1"
rustc-demangle = "0.1"
uuid = { version = "1.27", default-features = false, features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zlib-rs = { version = "0.6.8", default-features = false }
zstd = "0.13"

[build-dependencies]
cc = "1"

[profile.release]
panic = "abort"
# Copying generic and inline functions once per crate instead of once per
# codegen unit makes the executable about a quarter smaller.
codegen-units = 1

[patch.crates-io]
rayon-core = { path = "vendor/rayon-core" }
