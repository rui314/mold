[package]
name = "mold"
version = "2.42.1"
edition = "2021"
description = "A high-performance ELF linker, rewritten in Rust"
license = "MIT"
# tests/lib.rs belongs to the mold-tests workspace crate.
autotests = false

# The linker is generic over the target. Instantiating it for all twenty
# targets in one crate keeps the compiler on a single core for minutes, so
# each target is instantiated in a crate of its own under targets/, and the
# executable in cli/ dispatches to them.
[workspace]
members = ["cli", "targets/*", "tests"]
default-members = [".", "cli", "targets/*", "tests"]

[dependencies]
blake3 = "1.8.7"
bstr = "1"
cpp_demangle = "0.4"
crc32fast = "1"
flate2 = "1"
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc = "0.2"
libz-sys = "1.1.29"
memchr = "2.8.3"
memmap2 = "0.9"
rayon = "1"
rustc-demangle = "0.1"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 1
