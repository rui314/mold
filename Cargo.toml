# The Mach-O linker in macho/ is generic over the target. Each target is
# instantiated in a crate of its own under arch/, and the executable in
# cli/ dispatches to them, mirroring mold's ELF port.
[workspace]
resolver = "3"
members = ["cli", "macho", "arch/*", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
mold-macho = { path = "macho" }

[profile.release]
panic = "abort"
