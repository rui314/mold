[package]
name = "mold"
version.workspace = true
edition.workspace = true
description = "A high-performance ELF linker, rewritten in Rust"
license.workspace = true
# tests/lib.rs belongs to the mold-tests workspace crate.
autotests = false

# The linker is generic over the target. Instantiating it for all twenty
# targets in one crate keeps the compiler on a single core for minutes, so
# each target is instantiated in a crate of its own under arch/, and the
# executable in cli/ dispatches to them.
[workspace]
members = ["cli", "arch/*", "tests"]
default-members = [".", "cli", "arch/*", "tests"]

[workspace.package]
version = "2.42.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
mold = { path = "." }

[dependencies]
blake3 = "1.8.7"
bstr = "1"
cpp_demangle = "0.4"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc.workspace = true
libz-sys = "1.1.29"
memchr = "2.8.3"
memmap2 = "0.9"
rayon = "1"
rustc-demangle = "0.1"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 1
