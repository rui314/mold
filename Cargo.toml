# The ELF linker in elf/ is generic over the target. Instantiating it for
# all twenty targets in one crate keeps the compiler on a single core for
# minutes, so each target is instantiated in a crate of its own under
# arch/, and the executable in cli/ dispatches to them.
[workspace]
resolver = "3"
members = ["cli", "elf", "arch/*", "tests"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/rui314/mold"

# The workspace crates are published together and depend on each other's
# internals, so each one requires the exact version of the others. Keep
# these versions equal to the workspace version above.
[workspace.dependencies]
libc = "0.2"
libmold = { path = "elf", version = "=3.0.0" }
mold-arch-x86_64 = { path = "arch/x86_64", version = "=3.0.0" }
mold-arch-i386 = { path = "arch/i386", version = "=3.0.0" }
mold-arch-arm32 = { path = "arch/arm32", version = "=3.0.0" }
mold-arch-arm32be = { path = "arch/arm32be", version = "=3.0.0" }
mold-arch-arm64 = { path = "arch/arm64", version = "=3.0.0" }
mold-arch-arm64be = { path = "arch/arm64be", version = "=3.0.0" }
mold-arch-riscv64 = { path = "arch/riscv64", version = "=3.0.0" }
mold-arch-riscv64be = { path = "arch/riscv64be", version = "=3.0.0" }
mold-arch-riscv32 = { path = "arch/riscv32", version = "=3.0.0" }
mold-arch-riscv32be = { path = "arch/riscv32be", version = "=3.0.0" }
mold-arch-ppc64v2 = { path = "arch/ppc64v2", version = "=3.0.0" }
mold-arch-ppc32 = { path = "arch/ppc32", version = "=3.0.0" }
mold-arch-ppc64v1 = { path = "arch/ppc64v1", version = "=3.0.0" }
mold-arch-s390x = { path = "arch/s390x", version = "=3.0.0" }
mold-arch-sparc64 = { path = "arch/sparc64", version = "=3.0.0" }
mold-arch-m68k = { path = "arch/m68k", version = "=3.0.0" }
mold-arch-sh4 = { path = "arch/sh4", version = "=3.0.0" }
mold-arch-sh4be = { path = "arch/sh4be", version = "=3.0.0" }
mold-arch-loongarch64 = { path = "arch/loongarch64", version = "=3.0.0" }
mold-arch-loongarch32 = { path = "arch/loongarch32", version = "=3.0.0" }

[profile.release]
panic = "abort"
# Copying generic and inline functions once per crate instead of once per
# codegen unit makes the executable about a quarter smaller.
codegen-units = 1
