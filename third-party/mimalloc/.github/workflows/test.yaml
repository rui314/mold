      #   if: matrix.tests == 'android-x64'
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 27
      #     target: default
      #     arch: x86_64
      #     script: |
      #       adb push out/android-x64/mimalloc-test-api /data/local/tmp/
