[package]
name = "mold-elf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An internal crate of the mold linker, which implements its ELF linker"
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[dependencies]
blake3 = "1.8.7"
bstr = "1"
crc32fast = "1"
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc.workspace = true
memchr = "2.8.3"
mold-common.workspace = true
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1"
uuid = { version = "1.27", default-features = false, features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
cc = "1"
