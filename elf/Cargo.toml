[package]
name = "libmold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The internal library of the mold linker, whose API is not stable"
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[dependencies]
blake3 = "1.8.7"
bstr = "1"
cpp_demangle = "0.5.1"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
hashbrown = "0.17.1"
libc.workspace = true
libz-rs-sys = "0.6.8"
memchr = "2.8.3"
memmap2 = "0.9"
# std has no 64-bit atomics on hosts such as 32-bit PowerPC.
portable-atomic = "1"
rayon = "1"
rustc-demangle = "0.1"
uuid = { version = "1.27", default-features = false, features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zlib-rs = { version = "0.6.8", default-features = false }
zstd = "0.13"

[build-dependencies]
cc = "1"
