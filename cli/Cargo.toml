[package]
name = "mold-macho-cli"
version.workspace = true
edition.workspace = true
description = "The mold Mach-O linker executable"
license.workspace = true

[[bin]]
name = "mold"
path = "main.rs"

[[test]]
name = "integration"
path = "integration.rs"
harness = false

[dependencies]
mimalloc = { git = "https://github.com/rui314/mimalloc_rust", rev = "cc58b72775b8b5bc89ee37752af61fcb4f7c2909" }
mold-macho.workspace = true
mold-macho-arm64 = { path = "../arch/macho-arm64", optional = true }
mold-macho-x86_64 = { path = "../arch/macho-x86_64", optional = true }

[dev-dependencies]
mold-macho-tests = { path = "../tests" }

# One feature per target. All are built by default; a build for one
# target alone (`--no-default-features --features arm64`) is much faster.
[features]
default = ["arm64", "x86_64"]
system-allocator = []
arm64 = ["dep:mold-macho-arm64"]
x86_64 = ["dep:mold-macho-x86_64"]
