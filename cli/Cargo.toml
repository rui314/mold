[package]
name = "mold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A high-performance ELF linker, rewritten in Rust"
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["linker", "elf"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "mold"
path = "main.rs"

[[test]]
name = "integration"
path = "integration.rs"
harness = false

[dependencies]
mimalloc = { package = "mold-mimalloc", version = "0.1.52" }
libmold.workspace = true
mold-arch-x86_64 = { workspace = true, optional = true }
mold-arch-i386 = { workspace = true, optional = true }
mold-arch-arm32 = { workspace = true, optional = true }
mold-arch-arm32be = { workspace = true, optional = true }
mold-arch-arm64 = { workspace = true, optional = true }
mold-arch-arm64be = { workspace = true, optional = true }
mold-arch-riscv64 = { workspace = true, optional = true }
mold-arch-riscv64be = { workspace = true, optional = true }
mold-arch-riscv32 = { workspace = true, optional = true }
mold-arch-riscv32be = { workspace = true, optional = true }
mold-arch-ppc64v2 = { workspace = true, optional = true }
mold-arch-ppc32 = { workspace = true, optional = true }
mold-arch-ppc64v1 = { workspace = true, optional = true }
mold-arch-s390x = { workspace = true, optional = true }
mold-arch-sparc64 = { workspace = true, optional = true }
mold-arch-m68k = { workspace = true, optional = true }
mold-arch-sh4 = { workspace = true, optional = true }
mold-arch-sh4be = { workspace = true, optional = true }
mold-arch-loongarch64 = { workspace = true, optional = true }
mold-arch-loongarch32 = { workspace = true, optional = true }

[dev-dependencies]
mold-tests = { path = "../tests" }

# One feature per target. All are built by default; a build for one
# target alone (`--no-default-features --features x86_64`) is much faster.
[features]
default = [
    "x86_64", "i386", "arm32", "arm32be", "arm64", "arm64be", "riscv64", "riscv64be", "riscv32", "riscv32be",
    "ppc64v2", "ppc32", "ppc64v1", "s390x", "sparc64", "m68k", "sh4", "sh4be", "loongarch64", "loongarch32",
]
system-allocator = []
x86_64 = ["dep:mold-arch-x86_64"]
i386 = ["dep:mold-arch-i386"]
arm32 = ["dep:mold-arch-arm32"]
arm32be = ["dep:mold-arch-arm32be"]
arm64 = ["dep:mold-arch-arm64"]
arm64be = ["dep:mold-arch-arm64be"]
riscv64 = ["dep:mold-arch-riscv64"]
riscv64be = ["dep:mold-arch-riscv64be"]
riscv32 = ["dep:mold-arch-riscv32"]
riscv32be = ["dep:mold-arch-riscv32be"]
ppc64v2 = ["dep:mold-arch-ppc64v2"]
ppc32 = ["dep:mold-arch-ppc32"]
ppc64v1 = ["dep:mold-arch-ppc64v1"]
s390x = ["dep:mold-arch-s390x"]
sparc64 = ["dep:mold-arch-sparc64"]
m68k = ["dep:mold-arch-m68k"]
sh4 = ["dep:mold-arch-sh4"]
sh4be = ["dep:mold-arch-sh4be"]
loongarch64 = ["dep:mold-arch-loongarch64"]
loongarch32 = ["dep:mold-arch-loongarch32"]
