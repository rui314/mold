[package]
name = "mold-macho-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The mold Mach-O linker executable"
license.workspace = true
repository.workspace = true

[[bin]]
name = "mold"
path = "main.rs"

[[test]]
name = "integration"
path = "integration.rs"
harness = false

[dependencies]
mimalloc = { package = "mold-mimalloc", version = "0.1.52" }
mold-macho.workspace = true
mold-macho-arm64 = { workspace = true, optional = true }
mold-macho-x86_64 = { workspace = true, optional = true }

[dev-dependencies]
mold-macho-tests = { path = "../tests/macho" }

# One feature per target. All are built by default; a build for one
# target alone (`--no-default-features --features macho-arm64`) is much faster.
[features]
default = ["macho-arm64", "macho-x86_64"]
system-allocator = []
macho-arm64 = ["dep:mold-macho-arm64"]
macho-x86_64 = ["dep:mold-macho-x86_64"]
